spring:
  application:
    name: lifeos-backend

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:no-reply@lifeos.local}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
