services:
  frontend:
    image: black0ashes/lifeos-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    image: black0ashes/lifeos-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/lifeos
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_TTL_MINUTES=${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      - JWT_REFRESH_TOKEN_TTL_DAYS=${JWT_REFRESH_TOKEN_TTL_DAYS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_S3_KEY=${AWS_S3_KEY}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
