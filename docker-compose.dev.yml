services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: sh -c "npm config set fetch-timeout 60000 && npm config set fetch-retry-mintimeout 20000 && npm config set fetch-retry-maxtimeout 120000 && (if [ ! -d node_modules ] || [ package-lock.json -nt node_modules ]; then npm ci --prefer-offline --no-audit --no-fund; else echo 'Dependencies up-to-date'; fi) && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

  backend:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/lifeos
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_TTL_MINUTES=${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      - JWT_REFRESH_TOKEN_TTL_DAYS=${JWT_REFRESH_TOKEN_TTL_DAYS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - SERVER_PORT=8080
      - APP_FRONTEND_URL=http://localhost:5173
      - APP_MAIL_FROM=no-reply@lifeos.local
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
    volumes:
      - ./backend/demo:/app
      - maven_cache:/root/.m2
    depends_on:
      - db
      - mailpit
    command: mvn spring-boot:run

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - db
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  frontend_node_modules:
  npm_cache:
  postgres_data:
  maven_cache:
  pgadmin_data:
